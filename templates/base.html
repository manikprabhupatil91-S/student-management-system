<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">Student Management System</a>
        {% if current_user.is_authenticated %}
        <a class="nav-link text-white ms-3" href="{{ url_for('students') }}">Students</a>
        <a class="nav-link text-white ms-3" href="{{ url_for('courses') }}">Courses</a>
        <a class="nav-link text-white ms-3" href="{{ url_for('attendance') }}">Attendance</a>
        <a class="nav-link text-white me-auto ms-3" href="{{ url_for('marks') }}">Marks</a>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
