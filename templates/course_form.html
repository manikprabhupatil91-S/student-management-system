{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-3">{{ title }}</h4>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Course Code *</label>
                        <input type="text" name="course_code" class="form-control"
                               value="{{ course.course_code if course else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Course Name *</label>
                        <input type="text" name="course_name" class="form-control"
                               value="{{ course.course_name if course else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Credits</label>
                        <input type="number" name="credits" min="1" max="10" class="form-control"
                               value="{{ course.credits if course else 3 }}">
                    </div>
                    <button class="btn btn-success">Save</button>
                    <a href="{{ url_for('courses') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
