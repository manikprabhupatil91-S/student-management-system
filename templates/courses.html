{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Courses</h3>
    <a href="{{ url_for('add_course') }}" class="btn btn-primary">+ Add Course</a>
</div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-striped mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Code</th>
                    <th>Course Name</th>
                    <th>Credits</th>
                    <th>Students</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for c in courses %}
                <tr>
                    <td>{{ c.course_code }}</td>
                    <td>{{ c.course_name }}</td>
                    <td>{{ c.credits }}</td>
                    <td>{{ counts[c.id] }}</td>
                    <td>
                        <a href="{{ url_for('course_detail', course_id=c.id) }}"
                           class="btn btn-sm btn-info">Students</a>
                        <a href="{{ url_for('edit_course', course_id=c.id) }}"
                           class="btn btn-sm btn-warning">Edit</a>
                        <form method="POST" action="{{ url_for('delete_course', course_id=c.id) }}"
                              class="d-inline"
                              onsubmit="return confirm('Delete this course and its enrollments?');">
                            <button class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">No courses yet</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
